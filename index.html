<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Feelings Thermometer — Simple</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fd;font-family:Arial,sans-serif;color:#17243c}.app{height:100dvh;min-height:560px;display:flex;flex-direction:column;padding:12px 24px;max-width:1350px;margin:auto}h1{font-size:clamp(23px,2.5vw,36px);margin:0 0 8px;text-align:center}.main{display:grid;grid-template-columns:minmax(340px,1.3fr) minmax(280px,.7fr);gap:24px;flex:1;min-height:0}.thermo{background:#fff;border-radius:24px;display:flex;justify-content:center;align-items:stretch;padding:12px 18px;min-height:0;box-shadow:0 2px 12px #20345a12}.thermo-inner{height:100%;max-height:790px;display:flex;gap:20px;align-items:stretch}.track{position:relative;width:clamp(120px,13vw,195px);height:100%;min-height:400px;border:7px solid #202a3c;border-radius:70px;cursor:ns-resize;touch-action:none;background:linear-gradient(to top,#16aa61 0 16.666%,#16b9eb 16.666% 33.333%,#ffdc32 33.333% 50%,#ff9339 50% 66.666%,#ed3e3e 66.666% 83.333%,#493948 83.333% 100%);overflow:visible}.pointer{position:absolute;left:-18px;right:-18px;height:15px;border:4px solid #17243c;background:white;border-radius:15px;pointer-events:none;transform:translateY(50%);box-shadow:0 2px 5px #0004}.pointer:after{content:'◀';position:absolute;left:calc(100% + 12px);top:-19px;font-size:38px;color:#17243c}.scale{height:100%;min-height:400px;display:flex;flex-direction:column;justify-content:space-around;padding:0 0 0 30px}.scale div{font-weight:800;font-size:clamp(19px,2.2vw,32px);white-space:nowrap}.scale small{font-size:.65em;font-weight:500}.situation{background:white;border-radius:24px;box-shadow:0 2px 12px #20345a12;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:0}.emoji{font-size:clamp(110px,15vw,230px);line-height:1.15;text-align:center}.sentence{font-size:clamp(19px,2vw,29px);font-weight:700;text-align:center;max-width:350px}.question{font-size:clamp(18px,1.8vw,25px);text-align:center;color:#48566e}.controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:12px}button{font-size:clamp(18px,1.7vw,25px);padding:12px 20px;border:2px solid #b9c7dc;border-radius:14px;background:white;color:#182b4b;font-weight:700;cursor:pointer;min-height:56px}button:focus-visible{outline:4px solid #68a9ff}button.primary{background:#1454a8;color:white;border-color:#1454a8}.counter{font-size:18px;color:#66738b;min-width:60px;text-align:center}.feelings{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:420px}.feeling{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px;min-height:72px;padding:7px 9px;font-size:16px;border:2px solid #d7e0ed;border-radius:14px}.feeling span{font-size:34px;line-height:1}.feeling.selected{border:4px solid #1454a8;background:#e5f1ff;padding:5px 7px}.chosen{font-size:clamp(19px,2vw,27px);font-weight:800;color:#174d8d;text-align:center}.situation{gap:9px}.emoji{font-size:clamp(90px,12vw,165px)}.hint{font-size:15px;text-align:center;color:#53627c;margin:6px 0 0}@media(max-width:700px){.app{height:auto;min-height:100dvh;padding:10px}.main{grid-template-columns:1fr}.thermo{height:55vh;min-height:430px}.situation{min-height:250px}.emoji{font-size:105px}.controls{margin-bottom:8px}.scale div{font-size:20px}}@media(min-width:701px) and (max-height:700px){.app{min-height:520px}.track,.scale{min-height:360px}.emoji{font-size:110px}}
</style></head><body><main class="app"><h1>🌡️ How big is the feeling?</h1><div class="main"><section class="thermo" aria-label="Emotional thermometer"><div class="thermo-inner"><div class="track" id="track" role="slider" tabindex="0" aria-label="Feeling level" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1"><div class="pointer" id="pointer"></div></div><div class="scale"><div>6 <small>Very big</small></div><div>5 <small>Big</small></div><div>4 <small>Strong</small></div><div>3 <small>Medium</small></div><div>2 <small>Small</small></div><div>1 <small>Calm</small></div></div></div></section><section class="situation"><div class="emoji" id="emoji" aria-hidden="true">🚌</div><div class="sentence" id="sentence">You miss the bus.</div><div class="question">How might you feel?</div><div class="feelings" aria-label="Choose an emotion"><button class="feeling selected" data-feeling="Happy" aria-pressed="true"><span>😊</span>Happy</button><button class="feeling" data-feeling="Sad" aria-pressed="false"><span>😢</span>Sad</button><button class="feeling" data-feeling="Angry" aria-pressed="false"><span>😠</span>Angry</button><button class="feeling" data-feeling="Scared" aria-pressed="false"><span>😨</span>Scared</button><button class="feeling" data-feeling="Worried" aria-pressed="false"><span>😟</span>Worried</button></div><div class="chosen" id="chosen" aria-live="polite">😊 Happy — level 1</div></section></div><div class="controls"><button id="previous" aria-label="Previous situation">◀ Back</button><span class="counter" id="counter">1 / 20</span><button class="primary" id="next">Next ▶</button></div><p class="hint">Choose a feeling, then move the pointer to show how strong it is. There is no single right answer.</p></main><script>
const scenes=[['🚌','You miss the bus.'],['🎁','You get a present.'],['🗣️','Someone shouts at you.'],['👫','You make a friend.'],['📱','You lose your phone.'],['🎵','You hear your favourite music.'],['⚽','Your team wins.'],['⏰','You are running late.'],['😟','Someone laughs at you.'],['🐶','You see a big dog.'],['🌧️','Your plans are cancelled.'],['👏','Someone says “Well done!”'],['🎮','You lose a game.'],['🕷️','You see a spider.'],['🤝','Someone helps you.'],['🚪','Someone pushes in front of you.'],['📝','You try something new.'],['🎂','It is your birthday.'],['🧍','You are left out.'],['😴','You have not slept well.']];let index=0,level=1,feeling="Happy";const face={Happy:"😊",Sad:"😢",Angry:"😠",Scared:"😨",Worried:"😟"};const $=id=>document.getElementById(id);function render(){$('emoji').textContent=scenes[index][0];$('sentence').textContent=scenes[index][1];$('counter').textContent=(index+1)+' / '+scenes.length;$('pointer').style.bottom=((level-.5)/6*100)+'%';$('track').setAttribute('aria-valuenow',level);$('chosen').textContent=face[feeling]+' '+feeling+' — level '+level}function change(n){index=(index+n+scenes.length)%scenes.length;level=1;render()}$('next').onclick=()=>change(1);$('previous').onclick=()=>change(-1);document.querySelectorAll('.feeling').forEach(b=>b.addEventListener('click',()=>{feeling=b.dataset.feeling;document.querySelectorAll('.feeling').forEach(x=>{const on=x===b;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',String(on))});render()}));function point(y){const r=$('track').getBoundingClientRect();level=Math.max(1,Math.min(6,Math.floor((r.bottom-y)/r.height*6)+1));render()}$('track').addEventListener('pointerdown',e=>{$('track').setPointerCapture(e.pointerId);point(e.clientY)});$('track').addEventListener('pointermove',e=>{if(e.buttons||e.pressure>0)point(e.clientY)});$('track').addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();level=Math.max(1,Math.min(6,level+(e.key==='ArrowUp'||e.key==='ArrowRight'?1:-1)));render()}});render();
</script></body></html>
